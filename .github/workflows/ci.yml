name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["default", "classical", "pq", "classical,pq"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Every leg of this matrix builds, tests *and* lints. The `pq` leg in
      # particular had never compiled: `Identity` was gated on `classical`
      # while the handshake used it unconditionally, so a pure post-quantum
      # build had no signature scheme at all. A matrix that only ever built
      # the combination the author happened to run locally is not a matrix.
      - name: Flags
        id: flags
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            echo 'args=' >> "$GITHUB_OUTPUT"
          else
            echo 'args=--no-default-features --features ${{ matrix.features }}' >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch known-answer vectors
        run: .github/fetch-vectors.sh

      - run: cargo build -p codetalker-core ${{ steps.flags.outputs.args }}
      - run: cargo test -p codetalker-core ${{ steps.flags.outputs.args }} -- --nocapture
      - run: cargo clippy -p codetalker-core --all-targets ${{ steps.flags.outputs.args }} -- -D warnings

  msrv:
    name: MSRV ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The README pins this. A pinned MSRV nobody compiles against is a guess.
      - run: cargo build -p codetalker-core --no-default-features --features classical,pq

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

      # codetalker-wasm is `exclude`d from the root workspace, so neither of the
      # commands above compiles a single line of it. That gap let the browser
      # surface drift out of sync with codetalker-core until it no longer built
      # at all, and nothing failed until someone tried to deploy. `-p` cannot
      # reach an excluded package; --manifest-path can.
      - run: cargo fmt --manifest-path codetalker-wasm/Cargo.toml -- --check
      - run: >
          cargo clippy --manifest-path codetalker-wasm/Cargo.toml
          --target wasm32-unknown-unknown --all-targets -- -D warnings

      # The workflows lint too, because they are the one part of this repository
      # that nothing else compiles. A `|` block scalar ends at the first line
      # indented less than the block, so a multi-line inline script starting in
      # column 0 truncates the YAML mid-step -- which is exactly how the coverage
      # job shipped broken, and GitHub reports it only as "a workflow file issue"
      # with no line number.
      #
      # Downloaded at a pinned version and checked against a recorded SHA-256,
      # rather than the upstream `curl | bash` installer. A repository that pins
      # every action to a commit SHA should not fetch a linter from a branch.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --status
          tar xzf "$tarball" actionlint
          ./actionlint -color

      # TEACHING.md hands a classroom five URLs and the page footer links four
      # documents by absolute blob URL. `check-artifact.sh` checks the page's
      # references; nothing checked the documents'. Offline by design -- every
      # link it verifies is one this repository controls.
      - name: Documents point at things that exist
        run: node .github/checks/links.mjs

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # Pinned, not 'latest'. The action's default installed a wasm-pack
          # whose bundled wasm-opt could not parse what wasm-bindgen 0.2.126
          # emits -- it died on "Only 1 table definition allowed in MVP",
          # the externref table that reference-types support produces. This is
          # the version the demo was actually verified against.
          version: 'v0.15.0'

      # Same --out-dir as `deploy`. This job used to build into
      # codetalker-wasm/pkg while deploy built into web/pkg, so the job that was
      # supposed to be checking the browser artifact was checking a build that
      # lands somewhere the site never reads from. Same shape as the two
      # failures before it: CI verifying a near neighbour of the thing that
      # ships.
      - run: wasm-pack build codetalker-wasm --target web --release --out-dir ../web/pkg

      # Runs here rather than in `deploy`, because `deploy` is main-only: a PR
      # that broke the artifact would not learn about it until after merge.
      - name: Artifact is self-contained
        run: .github/check-artifact.sh

      # `check-artifact.sh` reads the page; these run it. Everything between the
      # crate's tests and a static file check -- that a switch does what its
      # caption says, that a link restores what it encoded, that a colour clears
      # AA -- was verified by hand until now, which means it was verified once.
      # All three defects the first manual pass found had already shipped.
      #
      # ubuntu-latest ships Google Chrome; the harness finds it, serves `web/`
      # itself and speaks CDP over Node's global WebSocket. No Playwright, no
      # Puppeteer, no dependency tree in a repository that pins its linter to a
      # recorded SHA.
      - name: Console does what the crate says it does
        run: node .github/checks/console.mjs

      - name: Operable without a mouse, colour perception, or a large window
        run: node .github/checks/a11y.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codetalker-wasm-pkg
          path: web/pkg/

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # --all-features stated explicitly because it is load-bearing and was
          # previously implicit. The action defaults to it; a local `cargo deny
          # check` does not. That difference meant the local run resolved only
          # the default feature set and never examined the `pq` tree -- the one
          # holding the post-quantum crates -- so it reported clean while CI
          # failed on the same commit. Same flags in both places, or the local
          # check is theatre.
          arguments: --all-features
          command: check advisories bans licenses sources

  audit:
    name: rustsec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      # `cargo deny check advisories` reads the same database, but only for the
      # workspace. This also covers codetalker-wasm, which is excluded from it
      # and is the crate the browser actually runs.
      - run: cargo audit
      - run: cargo audit --file codetalker-wasm/Cargo.lock

  cbom:
    name: cryptographic bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cbom
          path: "**/*.cdx.json"

  secret-independence:
    name: secret independence (known upstream breakage)
    runs-on: ubuntu-latest
    # Expected to fail, and kept so the failure stays visible.
    #
    # The intent: route libcrux's ring-element operations through
    # libcrux-secrets and have the compiler check secret independence. The
    # obstacle: `libcrux-kem` 0.0.9 has no `check-secret-independence` feature,
    # so with the mode enabled on `libcrux-ml-kem` its own callers no longer
    # typecheck -- it passes `[u8; 32]` where `Secret<u8>` is now expected.
    # That is upstream code, not this crate's, and not fixable from here short
    # of bypassing libcrux-kem entirely.
    #
    # The previous version of this job was worse than broken: it named a
    # feature on a package that was not a direct dependency, so it failed
    # instantly with "does not contain this feature" while THREAT_MODEL.md
    # cited it as evidence of a check being performed. It now genuinely
    # attempts the check and genuinely reports that upstream cannot support it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - run: cargo build -p codetalker-core --features check-secret-independence

  fuzz:
    name: fuzz (smoke, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: deobfuscate
            args: ""
          # `--features pq` is not decoration here. The fuzz crate mirrors
          # codetalker-core's feature names, and without it the ML-DSA-65 arm is
          # compiled out: a local run measured coverage at 971 without the flag
          # and 9,140 with it, on the same target and the same seed corpus. The
          # post-quantum verifier is the larger parser of the two, so fuzzing
          # only the classical arm would leave the newer code unexercised.
          - target: identity_verify
            args: "--features pq"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      # Sixty seconds from an empty corpus, which finds shallow crashes and
      # nothing else. The depth comes from `fuzz.yml`, which runs nightly against
      # a corpus cached between runs. This comment used to claim that workflow
      # existed before it did.
      - run: cargo fuzz run ${{ matrix.target }} ${{ matrix.args }} -- -max_total_time=60

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo install cargo-llvm-cov --locked

      - name: Fetch known-answer vectors
        run: .github/fetch-vectors.sh

      # `classical,pq` rather than --all-features, because --all-features pulls
      # `check-secret-independence` and that does not build -- see the job of the
      # same name. This is the widest feature set that compiles.
      - name: Measure
        run: |
          cargo llvm-cov -p codetalker-core \
            --no-default-features --features classical,pq \
            --summary-only --json --output-path coverage.json
          cargo llvm-cov -p codetalker-core \
            --no-default-features --features classical,pq \
            --summary-only --no-run

      # A floor, not a target. Set just under the measured value so it catches a
      # real regression without inviting tests written to colour a report green.
      # Coverage that gets chased is coverage that stops meaning anything.
      # awk rather than an inline Python heredoc: a `|` block scalar ends at the
      # first line indented less than the block, so a multi-line script whose
      # body starts in column 0 silently terminates the YAML mid-step. That is
      # what broke this workflow the first time it ran.
      - name: Floor
        run: |
          pct=$(python3 -c "import json;print(json.load(open('coverage.json'))['data'][0]['totals']['lines']['percent'])")
          printf 'line coverage: %.2f%%\n' "$pct"
          echo "line coverage: $(printf '%.2f' "$pct")%" >> "$GITHUB_STEP_SUMMARY"
          awk -v p="$pct" -v f=80 'BEGIN { if (p < f) { printf "coverage %.2f%% is below the %g%% floor\n", p, f; exit 1 } printf "%.2f%% >= %g%% floor\n", p, f }'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.json

  nist-vectors:
    name: FIPS 203 / 204 known-answer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Fetch ACVP vectors
        run: .github/fetch-vectors.sh
      - run: cargo test -p codetalker-core --features pq --test kat -- --nocapture

  deploy:
    # Build the wasm module and publish the demo to GitHub Pages.
    # Nothing here needs a server: wasm-pack output is static.
    needs: [core, wasm, lint, supply-chain]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      # Signing the wasm module needs to write an attestation to the repository's
      # attestation store. `id-token: write` above was already present for Pages
      # and is also what lets Sigstore mint a short-lived signing identity.
      attestations: write
      contents: read
    # Two Pages deployments in flight at once fail each other. Queue rather
    # than cancel: a superseded deploy still needs to finish releasing the
    # environment lock.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # Pinned, not 'latest'. The action's default installed a wasm-pack
          # whose bundled wasm-opt could not parse what wasm-bindgen 0.2.126
          # emits -- it died on "Only 1 table definition allowed in MVP",
          # the externref table that reference-types support produces. This is
          # the version the demo was actually verified against.
          version: 'v0.15.0'

      - name: Build wasm (PQ enabled)
        run: wasm-pack build codetalker-wasm --target web --release --out-dir ../web/pkg

      # Everything above this line guards what comes *in* -- pinned actions,
      # cargo-deny, cargo-audit, a bill of materials. None of it says anything
      # about what goes *out*. This is the other half: a signed, verifiable
      # statement that the wasm a reader's browser executes was produced by this
      # workflow, from this commit, and not substituted afterwards.
      #
      # Verify a downloaded module with:
      #   gh attestation verify codetalker_wasm_bg.wasm \
      #     --repo systemslibrarian/crypto-lab-ablation-wire
      - name: Attest the module the browser runs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: web/pkg/codetalker_wasm_bg.wasm

      - name: Disable Jekyll
        # Without this, Pages runs the site through Jekyll, which silently
        # drops any file or directory beginning with an underscore. wasm-pack
        # emits several. This one line prevents a genuinely baffling 404.
        run: touch web/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
