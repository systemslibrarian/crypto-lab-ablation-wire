name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["default", "classical", "pq", "classical,pq"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Every leg of this matrix builds, tests *and* lints. The `pq` leg in
      # particular had never compiled: `Identity` was gated on `classical`
      # while the handshake used it unconditionally, so a pure post-quantum
      # build had no signature scheme at all. A matrix that only ever built
      # the combination the author happened to run locally is not a matrix.
      - name: Flags
        id: flags
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            echo 'args=' >> "$GITHUB_OUTPUT"
          else
            echo 'args=--no-default-features --features ${{ matrix.features }}' >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch known-answer vectors
        run: .github/fetch-vectors.sh

      - run: cargo build -p codetalker-core ${{ steps.flags.outputs.args }}
      - run: cargo test -p codetalker-core ${{ steps.flags.outputs.args }} -- --nocapture
      - run: cargo clippy -p codetalker-core --all-targets ${{ steps.flags.outputs.args }} -- -D warnings

  msrv:
    name: MSRV ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # The README pins this. A pinned MSRV nobody compiles against is a guess.
      - run: cargo build -p codetalker-core --no-default-features --features classical,pq

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

      # codetalker-wasm is `exclude`d from the root workspace, so neither of the
      # commands above compiles a single line of it. That gap let the browser
      # surface drift out of sync with codetalker-core until it no longer built
      # at all, and nothing failed until someone tried to deploy. `-p` cannot
      # reach an excluded package; --manifest-path can.
      - run: cargo fmt --manifest-path codetalker-wasm/Cargo.toml -- --check
      - run: >
          cargo clippy --manifest-path codetalker-wasm/Cargo.toml
          --target wasm32-unknown-unknown --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build codetalker-wasm --target web --release
      - uses: actions/upload-artifact@v4
        with:
          name: codetalker-wasm-pkg
          path: codetalker-wasm/pkg/

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  audit:
    name: rustsec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # `cargo deny check advisories` reads the same database, but only for the
      # workspace. This also covers codetalker-wasm, which is excluded from it
      # and is the crate the browser actually runs.
      - run: cargo audit
      - run: cargo audit --file codetalker-wasm/Cargo.lock

  cbom:
    name: cryptographic bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: cbom
          path: "**/*.cdx.json"

  secret-independence:
    name: secret independence (libcrux)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Routes ring-element operations through libcrux-secrets and checks
      # secret independence at compile time. Verifies the Rust, not the
      # emitted machine code -- see THREAT_MODEL.md, adversary A5.
      - run: cargo build -p codetalker-core --features pq,libcrux-ml-kem/check-secret-independence

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      # Short run on every PR; the corpus grows via scheduled long runs.
      - run: cargo fuzz run deobfuscate -- -max_total_time=60

  nist-vectors:
    name: FIPS 203 / 204 known-answer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch ACVP vectors
        run: .github/fetch-vectors.sh
      - run: cargo test -p codetalker-core --features pq --test kat -- --nocapture

  deploy:
    # Build the wasm module and publish the demo to GitHub Pages.
    # Nothing here needs a server: wasm-pack output is static.
    needs: [core, wasm, lint, supply-chain]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Two Pages deployments in flight at once fail each other. Queue rather
    # than cancel: a superseded deploy still needs to finish releasing the
    # environment lock.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build wasm (PQ enabled)
        run: wasm-pack build codetalker-wasm --target web --release --out-dir ../web/pkg

      - name: Disable Jekyll
        # Without this, Pages runs the site through Jekyll, which silently
        # drops any file or directory beginning with an underscore. wasm-pack
        # emits several. This one line prevents a genuinely baffling 404.
        run: touch web/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@v4
