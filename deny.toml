# cargo-deny: supply chain policy.
# A crypto demo that ships without one is asking a reader to trust the
# dependency tree on faith.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
