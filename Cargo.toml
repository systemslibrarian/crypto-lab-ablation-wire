[workspace]
resolver = "2"
members = ["codetalker-core"]
# codetalker-wasm is excluded from the default workspace build because it
# only compiles for wasm32-unknown-unknown. Build it with:
#   wasm-pack build codetalker-wasm --target web
exclude = [
    "codetalker-wasm",
    "vendor/libcrux-kem-0.0.10",
    "vendor/libcrux-ml-kem-0.0.11",
    "vendor/libcrux-sha3-0.0.11",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/systemslibrarian/crypto-lab-ablation-wire"

[patch.crates-io]
libcrux-kem = { path = "vendor/libcrux-kem-0.0.10" }
libcrux-ml-kem = { path = "vendor/libcrux-ml-kem-0.0.11" }
libcrux-sha3 = { path = "vendor/libcrux-sha3-0.0.11" }
