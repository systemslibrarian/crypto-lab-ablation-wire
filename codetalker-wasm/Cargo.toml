[package]
name = "codetalker-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
codetalker-core = { path = "../codetalker-core", features = ["pq"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
